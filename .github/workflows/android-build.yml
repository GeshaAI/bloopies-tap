name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Godot 4.4.1 Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components required by Godot 4.4
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK and JDK paths
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_SDK_ROOT}"
          test -d "${JAVA_HOME}"
          mkdir -p "${HOME}/.config/godot"
          cat > "${HOME}/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          rm -f debug.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Validate Android signing preset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          preset = Path("export_presets.cfg").read_text(encoding="utf-8")
          required = {
              'keystore/debug="debug.keystore"',
              'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password="android"',
              'package/unique_name="com.bloopiesworld.bloopiestap"',
              'export_path="build/BloopiesTap-debug.apk"',
          }
          missing = sorted(value for value in required if value not in preset)
          if missing:
              raise SystemExit("Invalid Android export preset; missing: " + ", ".join(missing))
          if not Path("debug.keystore").is_file():
              raise SystemExit("debug.keystore was not created in the project root")
          print("Android debug signing preset is complete and the keystore exists.")
          PY

      - name: Diagnose Android export environment
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Tool versions ==="
          godot --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"

          echo "=== Android SDK tools ==="
          command -v sdkmanager
          command -v adb
          adb version
          test -x "${ANDROID_SDK_ROOT}/platform-tools/adb"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-35"
          test -x "${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt2"
          test -x "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          find "${ANDROID_SDK_ROOT}/platform-tools" -maxdepth 1 -type f -printf '%f\n' | sort
          find "${ANDROID_SDK_ROOT}/build-tools" -maxdepth 2 -type f \
            \( -name 'aapt2' -o -name 'apksigner*' -o -name 'zipalign' \) -print | sort
          find "${ANDROID_SDK_ROOT}/platforms" -maxdepth 2 -name android.jar -print | sort

          echo "=== Godot Android configuration ==="
          cat "${HOME}/.config/godot/editor_settings-4.tres"
          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey
          template_root="${HOME}/.local/share/godot/export_templates"
          test -d "${template_root}"
          find "${template_root}" -maxdepth 3 -type f -printf '%p\n' | sort
          test -n "$(find "${template_root}" -type f -name 'android_debug.apk' -print -quit)"

          echo "=== ADB server (no emulator or device is required) ==="
          adb start-server
          adb devices -l

      - name: Import project and verify resources
        run: godot --headless --verbose --editor --path . --quit

      - name: Export debug APK
        run: |
          set -euo pipefail
          godot --headless --verbose --path . --export-debug "Android" build/BloopiesTap-debug.apk

      - name: Verify APK exists
        run: test -s build/BloopiesTap-debug.apk

      - name: Upload Bloopies Tap Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bloopies-Tap-Android
          path: build/BloopiesTap-debug.apk
          if-no-files-found: error
          retention-days: 30
